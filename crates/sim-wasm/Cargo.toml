[package]
name = "sim-wasm"
description = "wasm-bindgen adapter exposing sim-core to the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim-core = { path = "../sim-core" }
# Must match the wasm-bindgen CLI version exactly (ADR 0003). Bump both together:
# scripts/build-wasm.mjs reads this line and checks the installed CLI.
wasm-bindgen = "=0.2.130"
